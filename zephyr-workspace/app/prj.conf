CONFIG_LOG=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# New USB device stack. Legacy usb_enable()/CONFIG_USB_DEVICE_STACK is
# deprecated and slated for removal in Zephyr v4.5.0 (we're pinned to
# v4.4.2, see app/west.yml) — moving now avoids touching this twice.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# In-tree helper (subsys/usb/device_next/app/cdc_acm_serial.c) that wires
# up descriptors + a single CDC ACM instance + usbd_init()/usbd_enable()
# automatically, driven by the cdc_acm_uart0 devicetree node in
# boards/rpi_pico2_rp2350a_m33.overlay. No USBD boilerplate needed in main.c.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="TP Analyzer"

# LVGL and display
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9488=y
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_MEM_POOL_SIZE=80000
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# POWMAN RTC
CONFIG_RTC=y
CONFIG_POWMAN_RTC_RPI_PICO=y
CONFIG_STACK_SENTINEL=y

# Encoder input
CONFIG_INPUT=y
CONFIG_LV_Z_ENCODER_INPUT=y