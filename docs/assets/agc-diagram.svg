<text x="500.0" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#5b6b82">La ganancia solo cambia en el tiempo muerto entre bloques del buffer ping-pong — nunca a mitad de una ventana de FFT (§6.3)</text>
