<text x="280.0" y="722.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Alerta de conexión</text>
<text x="280.0" y="741.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Conexión errónea o fase faltante</text>
<rect x="580.0" y="680.0" width="380.0" height="100.0" rx="8" fill="#d9f2e6" stroke="#33475b" stroke-width="1.6"/>
<text x="770.0" y="713.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Topología confirmada</text>
<text x="770.0" y="732.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">DSP usa el set de fórmulas de</text>
<text x="770.0" y="750.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">la topología detectada</text>
