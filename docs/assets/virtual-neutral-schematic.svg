<text x="575.0" y="454" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Neutro virtual — punto estrella artificial</text>
<text x="575.0" y="474" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#5b6b82">flotante — sin conexión a tierra / PE, sin switches físicos</text>
<rect x="75.0" y="491.0" width="1000" height="108" rx="8" fill="#f7f7f7" stroke="#c7ccd4" stroke-width="1.2"/>
<text x="575.0" y="515" font-family="Helvetica, Arial, sans-serif" font-size="12.8" text-anchor="middle" fill="#33475b">Con las 3 fases balanceadas, el punto estrella resistivo (3x 1 MΩ) se estabiliza cerca del</text>
<text x="575.0" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12.8" text-anchor="middle" fill="#33475b">potencial del neutro real incluso sin neutro físico presente. El canal VN (columna N) mide la</text>
<text x="575.0" y="555" font-family="Helvetica, Arial, sans-serif" font-size="12.8" text-anchor="middle" fill="#33475b">tensión del borne de neutro físico contra este mismo punto — si no hay neutro conectado, VN</text>
<text x="575.0" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12.8" text-anchor="middle" fill="#33475b">flota y el firmware lo interpreta como red en triángulo (ver Fig. 4, §4.4).</text>
